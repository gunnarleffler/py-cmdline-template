[project]
name = "py-cmdline-template"
version = "2.0.0"
description = "Small Python command line starters"
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
target-version = "py314"
indent-width = 2
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
